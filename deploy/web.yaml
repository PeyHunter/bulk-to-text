apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      nodeSelector:
        kubernetes.io/hostname: k3s-2
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          # Kustomize sets the sha-<commit> tag (kustomization.yaml).
          image: ghcr.io/peyhunter/bulk-to-text
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            # Approximate USD to DKK rate, only used to show cost in kroner.
            - name: USD_TO_DKK
              value: "6.9"
            - name: APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bulk-to-text-secrets
                  key: APP_PASSWORD
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: bulk-to-text-secrets
                  key: SESSION_SECRET
            # Optional: without it the app runs and says reading text isn't set up yet.
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: bulk-to-text-secrets
                  key: ANTHROPIC_API_KEY
                  optional: true
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            # Up to four 20 MB images at once, each decoded (a 12 MP HEIC is about 50 MB of pixels) and base64'd.
            limits:
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector:
    app: web
  ports:
    - name: http
      port: 80
      targetPort: http
