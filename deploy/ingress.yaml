# Sends plain http visitors to https.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
# Public hostname. cert-manager issues the certificate; external-dns creates the Cloudflare record from the host.
# Upload size: Traefik sets no request body limit unless a Buffering middleware adds one, and none is used here,
# so 20 MB images pass; the app itself refuses anything over 20 MB (src/server/app.ts).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    traefik.ingress.kubernetes.io/router.middlewares: bulk-to-text-redirect-https@kubernetescrd
spec:
  tls:
    - hosts: [bulk-to-text.peytonhunter.com]
      secretName: bulk-to-text-tls
  rules:
    - host: bulk-to-text.peytonhunter.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  name: http
